<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FractalCNN Architecture</title>
<style>
  body { margin: 0; background: #0f1117; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 40px 20px; }
  svg { max-width: 900px; width: 100%; }

  .block-main   { fill: #1e2a3a; stroke: #4a9eff; stroke-width: 2; rx: 10; }
  .block-conv   { fill: #1a2a1a; stroke: #4caf50; stroke-width: 2; }
  .block-pool   { fill: #2a1a2a; stroke: #bb86fc; stroke-width: 2; }
  .block-head   { fill: #2a1a1a; stroke: #ff6b6b; stroke-width: 2; }
  .block-head2  { fill: #1a1a2a; stroke: #ffa726; stroke-width: 2; }
  .block-out    { fill: #1a2a2a; stroke: #26c6da; stroke-width: 2; }
  .block-input  { fill: #2a2000; stroke: #ffd600; stroke-width: 2; }

  text { fill: #e0e0e0; font-size: 13px; text-anchor: middle; dominant-baseline: middle; }
  .label-small { font-size: 11px; fill: #9e9e9e; }
  .label-title { font-size: 14px; font-weight: bold; fill: #ffffff; }
  .label-dim   { font-size: 10px; fill: #78909c; }
  .arrow { stroke: #546e7a; stroke-width: 2; fill: none; marker-end: url(#arr); }
  .arrow-split { stroke: #546e7a; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; marker-end: url(#arr); }
  .section-label { fill: #607d8b; font-size: 11px; text-anchor: start; }
</style>
</head>
<body>
<svg viewBox="0 0 860 1460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#546e7a"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Title -->
  <text x="430" y="28" style="font-size:20px;font-weight:bold;fill:#4a9eff;text-anchor:middle">FractalCNN Architecture</text>
  <text x="430" y="50" class="label-small" style="text-anchor:middle">Multi-task: Classification (15 классов) + Regression (4 параметра)</text>

  <!-- ═══════════════ INPUT ═══════════════ -->
  <rect x="280" y="70" width="300" height="52" rx="10" class="block-input" filter="url(#glow)"/>
  <text x="430" y="88" class="label-title" style="fill:#ffd600">INPUT</text>
  <text x="430" y="107" class="label-dim">128 × 128 × 3 (RGB изображение)</text>

  <line x1="430" y1="122" x2="430" y2="145" class="arrow"/>

  <!-- ═══════════════ CONVBLOCK 1 ═══════════════ -->
  <text x="72" y="185" class="section-label">ConvBlock 1</text>
  <rect x="120" y="152" width="620" height="80" rx="8" class="block-conv"/>
  <text x="430" y="175" class="label-title" style="fill:#4caf50">ConvBlock 1</text>
  <!-- inner blocks -->
  <rect x="135" y="188" width="90" height="30" rx="5" fill="#0d1f0d" stroke="#4caf50" stroke-width="1"/>
  <text x="180" y="203" style="font-size:10px">Conv2d 3→32</text>
  <rect x="235" y="188" width="70" height="30" rx="5" fill="#0d1f0d" stroke="#66bb6a" stroke-width="1"/>
  <text x="270" y="203" style="font-size:10px">BatchNorm</text>
  <rect x="315" y="188" width="55" height="30" rx="5" fill="#0d1f0d" stroke="#a5d6a7" stroke-width="1"/>
  <text x="342" y="203" style="font-size:10px">ReLU</text>
  <rect x="380" y="188" width="90" height="30" rx="5" fill="#0d1f0d" stroke="#4caf50" stroke-width="1"/>
  <text x="425" y="203" style="font-size:10px">Conv2d 32→32</text>
  <rect x="480" y="188" width="70" height="30" rx="5" fill="#0d1f0d" stroke="#66bb6a" stroke-width="1"/>
  <text x="515" y="203" style="font-size:10px">BatchNorm</text>
  <rect x="560" y="188" width="55" height="30" rx="5" fill="#0d1f0d" stroke="#a5d6a7" stroke-width="1"/>
  <text x="587" y="203" style="font-size:10px">ReLU</text>
  <rect x="625" y="188" width="100" height="30" rx="5" fill="#2a1a2a" stroke="#bb86fc" stroke-width="1"/>
  <text x="675" y="203" style="font-size:10px;fill:#bb86fc">MaxPool2d ×2</text>
  <text x="430" y="225" class="label-dim">выход: 64 × 64 × 32</text>

  <line x1="430" y1="232" x2="430" y2="255" class="arrow"/>

  <!-- ═══════════════ CONVBLOCK 2 ═══════════════ -->
  <text x="72" y="295" class="section-label">ConvBlock 2</text>
  <rect x="120" y="262" width="620" height="80" rx="8" class="block-conv"/>
  <text x="430" y="285" class="label-title" style="fill:#4caf50">ConvBlock 2</text>
  <rect x="135" y="298" width="90" height="30" rx="5" fill="#0d1f0d" stroke="#4caf50" stroke-width="1"/>
  <text x="180" y="313" style="font-size:10px">Conv2d 32→64</text>
  <rect x="235" y="298" width="70" height="30" rx="5" fill="#0d1f0d" stroke="#66bb6a" stroke-width="1"/>
  <text x="270" y="313" style="font-size:10px">BatchNorm</text>
  <rect x="315" y="298" width="55" height="30" rx="5" fill="#0d1f0d" stroke="#a5d6a7" stroke-width="1"/>
  <text x="342" y="313" style="font-size:10px">ReLU</text>
  <rect x="380" y="298" width="90" height="30" rx="5" fill="#0d1f0d" stroke="#4caf50" stroke-width="1"/>
  <text x="425" y="313" style="font-size:10px">Conv2d 64→64</text>
  <rect x="480" y="298" width="70" height="30" rx="5" fill="#0d1f0d" stroke="#66bb6a" stroke-width="1"/>
  <text x="515" y="313" style="font-size:10px">BatchNorm</text>
  <rect x="560" y="298" width="55" height="30" rx="5" fill="#0d1f0d" stroke="#a5d6a7" stroke-width="1"/>
  <text x="587" y="313" style="font-size:10px">ReLU</text>
  <rect x="625" y="298" width="100" height="30" rx="5" fill="#2a1a2a" stroke="#bb86fc" stroke-width="1"/>
  <text x="675" y="313" style="font-size:10px;fill:#bb86fc">MaxPool2d ×2</text>
  <text x="430" y="335" class="label-dim">выход: 32 × 32 × 64</text>

  <line x1="430" y1="342" x2="430" y2="365" class="arrow"/>

  <!-- ═══════════════ CONVBLOCK 3 ═══════════════ -->
  <text x="72" y="405" class="section-label">ConvBlock 3</text>
  <rect x="120" y="372" width="620" height="80" rx="8" class="block-conv"/>
  <text x="430" y="395" class="label-title" style="fill:#4caf50">ConvBlock 3</text>
  <rect x="135" y="408" width="95" height="30" rx="5" fill="#0d1f0d" stroke="#4caf50" stroke-width="1"/>
  <text x="182" y="423" style="font-size:10px">Conv2d 64→128</text>
  <rect x="240" y="408" width="70" height="30" rx="5" fill="#0d1f0d" stroke="#66bb6a" stroke-width="1"/>
  <text x="275" y="423" style="font-size:10px">BatchNorm</text>
  <rect x="320" y="408" width="55" height="30" rx="5" fill="#0d1f0d" stroke="#a5d6a7" stroke-width="1"/>
  <text x="347" y="423" style="font-size:10px">ReLU</text>
  <rect x="385" y="408" width="95" height="30" rx="5" fill="#0d1f0d" stroke="#4caf50" stroke-width="1"/>
  <text x="432" y="423" style="font-size:10px">Conv2d 128→128</text>
  <rect x="490" y="408" width="70" height="30" rx="5" fill="#0d1f0d" stroke="#66bb6a" stroke-width="1"/>
  <text x="525" y="423" style="font-size:10px">BatchNorm</text>
  <rect x="570" y="408" width="55" height="30" rx="5" fill="#0d1f0d" stroke="#a5d6a7" stroke-width="1"/>
  <text x="597" y="423" style="font-size:10px">ReLU</text>
  <rect x="635" y="408" width="90" height="30" rx="5" fill="#2a1a2a" stroke="#bb86fc" stroke-width="1"/>
  <text x="680" y="423" style="font-size:10px;fill:#bb86fc">MaxPool2d ×2</text>
  <text x="430" y="445" class="label-dim">выход: 16 × 16 × 128</text>

  <line x1="430" y1="452" x2="430" y2="475" class="arrow"/>

  <!-- ═══════════════ CONVBLOCK 4 ═══════════════ -->
  <text x="72" y="515" class="section-label">ConvBlock 4</text>
  <rect x="120" y="482" width="620" height="80" rx="8" class="block-conv"/>
  <text x="430" y="505" class="label-title" style="fill:#4caf50">ConvBlock 4</text>
  <rect x="135" y="518" width="95" height="30" rx="5" fill="#0d1f0d" stroke="#4caf50" stroke-width="1"/>
  <text x="182" y="533" style="font-size:10px">Conv2d 128→256</text>
  <rect x="240" y="518" width="70" height="30" rx="5" fill="#0d1f0d" stroke="#66bb6a" stroke-width="1"/>
  <text x="275" y="533" style="font-size:10px">BatchNorm</text>
  <rect x="320" y="518" width="55" height="30" rx="5" fill="#0d1f0d" stroke="#a5d6a7" stroke-width="1"/>
  <text x="347" y="533" style="font-size:10px">ReLU</text>
  <rect x="385" y="518" width="95" height="30" rx="5" fill="#0d1f0d" stroke="#4caf50" stroke-width="1"/>
  <text x="432" y="533" style="font-size:10px">Conv2d 256→256</text>
  <rect x="490" y="518" width="70" height="30" rx="5" fill="#0d1f0d" stroke="#66bb6a" stroke-width="1"/>
  <text x="525" y="533" style="font-size:10px">BatchNorm</text>
  <rect x="570" y="518" width="55" height="30" rx="5" fill="#0d1f0d" stroke="#a5d6a7" stroke-width="1"/>
  <text x="597" y="533" style="font-size:10px">ReLU</text>
  <rect x="635" y="518" width="90" height="30" rx="5" fill="#2a1a2a" stroke="#bb86fc" stroke-width="1"/>
  <text x="680" y="533" style="font-size:10px;fill:#bb86fc">MaxPool2d ×2</text>
  <text x="430" y="555" class="label-dim">выход: 8 × 8 × 256</text>

  <line x1="430" y1="562" x2="430" y2="585" class="arrow"/>

  <!-- ═══════════════ GLOBAL POOL ═══════════════ -->
  <rect x="280" y="592" width="300" height="48" rx="8" class="block-pool" filter="url(#glow)"/>
  <text x="430" y="609" class="label-title" style="fill:#bb86fc">AdaptiveAvgPool2d(1)</text>
  <text x="430" y="628" class="label-dim">8×8×256 → 1×1×256</text>

  <line x1="430" y1="640" x2="430" y2="663" class="arrow"/>

  <!-- ═══════════════ FLATTEN ═══════════════ -->
  <rect x="305" y="670" width="250" height="44" rx="8" fill="#1e2535" stroke="#4a9eff" stroke-width="2"/>
  <text x="430" y="686" class="label-title" style="fill:#4a9eff">Flatten</text>
  <text x="430" y="703" class="label-dim">256-мерный вектор признаков</text>

  <!-- ═══════════════ SPLIT ═══════════════ -->
  <line x1="430" y1="714" x2="430" y2="735" class="arrow"/>

  <!-- Split node -->
  <circle cx="430" cy="748" r="14" fill="#263238" stroke="#546e7a" stroke-width="2"/>
  <text x="430" y="748" style="font-size:18px;fill:#90a4ae">⋮</text>

  <!-- Left branch to cls -->
  <path d="M416,748 Q220,748 220,790" class="arrow-split"/>
  <!-- Right branch to reg -->
  <path d="M444,748 Q640,748 640,790" class="arrow-split"/>

  <!-- ═══════════════ CLS HEAD ═══════════════ -->
  <text x="100" y="778" class="section-label">Cls Head</text>
  <rect x="80" y="787" width="280" height="230" rx="10" class="block-head" filter="url(#glow)"/>
  <text x="220" y="808" class="label-title" style="fill:#ff6b6b">Classification Head</text>

  <rect x="100" y="820" width="240" height="34" rx="6" fill="#1a0a0a" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="220" y="834">Linear(256 → 256)</text>
  <text x="220" y="848" class="label-dim">полносвязный слой</text>

  <line x1="220" y1="854" x2="220" y2="872" class="arrow"/>
  <rect x="100" y="872" width="240" height="28" rx="6" fill="#1a0a0a" stroke="#ef9a9a" stroke-width="1"/>
  <text x="220" y="886">ReLU</text>

  <line x1="220" y1="900" x2="220" y2="918" class="arrow"/>
  <rect x="100" y="918" width="240" height="28" rx="6" fill="#1a0a0a" stroke="#ef9a9a" stroke-width="1"/>
  <text x="220" y="932">Dropout (p=0.4)</text>

  <line x1="220" y1="946" x2="220" y2="964" class="arrow"/>
  <rect x="100" y="964" width="240" height="34" rx="6" fill="#1a0a0a" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="220" y="978">Linear(256 → 15)</text>
  <text x="220" y="992" class="label-dim">15 классов фракталов</text>

  <!-- ═══════════════ REG HEAD ═══════════════ -->
  <text x="502" y="778" class="section-label">Reg Head</text>
  <rect x="500" y="787" width="280" height="230" rx="10" class="block-head2" filter="url(#glow)"/>
  <text x="640" y="808" class="label-title" style="fill:#ffa726">Regression Head</text>

  <rect x="520" y="820" width="240" height="34" rx="6" fill="#0a0a1a" stroke="#ffa726" stroke-width="1.5"/>
  <text x="640" y="834">Linear(256 → 256)</text>
  <text x="640" y="848" class="label-dim">полносвязный слой</text>

  <line x1="640" y1="854" x2="640" y2="872" class="arrow"/>
  <rect x="520" y="872" width="240" height="28" rx="6" fill="#0a0a1a" stroke="#ffcc80" stroke-width="1"/>
  <text x="640" y="886">ReLU</text>

  <line x1="640" y1="900" x2="640" y2="918" class="arrow"/>
  <rect x="520" y="918" width="240" height="28" rx="6" fill="#0a0a1a" stroke="#ffcc80" stroke-width="1"/>
  <text x="640" y="932">Dropout (p=0.3)</text>

  <line x1="640" y1="946" x2="640" y2="964" class="arrow"/>
  <rect x="520" y="964" width="240" height="34" rx="6" fill="#0a0a1a" stroke="#ffa726" stroke-width="1.5"/>
  <text x="640" y="978">Linear(256 → 4)</text>
  <text x="640" y="992" class="label-dim">c_real, c_imag, zoom, iter</text>

  <!-- ═══════════════ OUTPUTS ═══════════════ -->
  <line x1="220" y1="998" x2="220" y2="1050" class="arrow"/>
  <rect x="80" y="1050" width="280" height="54" rx="10" class="block-out" filter="url(#glow)"/>
  <text x="220" y="1068" class="label-title" style="fill:#26c6da">OUTPUT: Класс фрактала</text>
  <text x="220" y="1087" class="label-dim">Softmax → 15 вероятностей</text>

  <line x1="640" y1="998" x2="640" y2="1050" class="arrow"/>
  <rect x="500" y="1050" width="280" height="54" rx="10" class="block-out" filter="url(#glow)"/>
  <text x="640" y="1068" class="label-title" style="fill:#26c6da">OUTPUT: Параметры</text>
  <text x="640" y="1087" class="label-dim">4 числа → денормализация</text>

  <!-- ═══════════════ LOSS ═══════════════ -->
  <line x1="220" y1="1104" x2="220" y2="1150" class="arrow"/>
  <line x1="640" y1="1104" x2="640" y2="1150" class="arrow"/>

  <rect x="100" y="1157" width="260" height="44" rx="8" fill="#1a1500" stroke="#ffd600" stroke-width="1.5"/>
  <text x="230" y="1173" style="fill:#ffd600;font-size:12px;font-weight:bold">CrossEntropyLoss</text>
  <text x="230" y="1190" class="label-dim">классификация</text>

  <rect x="500" y="1157" width="260" height="44" rx="8" fill="#1a1500" stroke="#ffd600" stroke-width="1.5"/>
  <text x="630" y="1173" style="fill:#ffd600;font-size:12px;font-weight:bold">SmoothL1Loss × λ</text>
  <text x="630" y="1190" class="label-dim">регрессия (λ=0 в cls-only)</text>

  <!-- combined loss -->
  <line x1="230" y1="1201" x2="430" y2="1245" class="arrow"/>
  <line x1="630" y1="1201" x2="430" y2="1245" class="arrow"/>

  <rect x="280" y="1252" width="300" height="44" rx="10" fill="#1a0a2a" stroke="#ce93d8" stroke-width="2" filter="url(#glow)"/>
  <text x="430" y="1268" style="fill:#ce93d8;font-size:13px;font-weight:bold">Total Loss = L_cls + λ·L_reg</text>
  <text x="430" y="1285" class="label-dim">Adam optimizer + CosineAnnealingLR</text>

  <!-- ═══════════════ LEGEND ═══════════════ -->
  <rect x="50" y="1320" width="760" height="120" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="430" y="1342" style="font-size:13px;fill:#8b949e;text-anchor:middle;font-weight:bold">Легенда</text>
  <rect x="75" y="1356" width="16" height="16" rx="3" fill="#1a2a1a" stroke="#4caf50" stroke-width="2"/>
  <text x="100" y="1364" style="font-size:11px;text-anchor:start;fill:#ccc">ConvBlock (Conv→BN→ReLU×2 + MaxPool)</text>
  <rect x="75" y="1380" width="16" height="16" rx="3" fill="#2a1a2a" stroke="#bb86fc" stroke-width="2"/>
  <text x="100" y="1388" style="font-size:11px;text-anchor:start;fill:#ccc">Pooling</text>
  <rect x="300" y="1356" width="16" height="16" rx="3" fill="#1a0a0a" stroke="#ff6b6b" stroke-width="2"/>
  <text x="325" y="1364" style="font-size:11px;text-anchor:start;fill:#ccc">Classification Head (15 классов)</text>
  <rect x="300" y="1380" width="16" height="16" rx="3" fill="#0a0a1a" stroke="#ffa726" stroke-width="2"/>
  <text x="325" y="1388" style="font-size:11px;text-anchor:start;fill:#ccc">Regression Head (4 параметра)</text>
  <rect x="560" y="1356" width="16" height="16" rx="3" fill="#1a2a2a" stroke="#26c6da" stroke-width="2"/>
  <text x="585" y="1364" style="font-size:11px;text-anchor:start;fill:#ccc">Выход модели</text>
  <rect x="560" y="1380" width="16" height="16" rx="3" fill="#1a1500" stroke="#ffd600" stroke-width="2"/>
  <text x="585" y="1388" style="font-size:11px;text-anchor:start;fill:#ccc">Функция потерь</text>

  <!-- params count -->
  <text x="430" y="1425" style="font-size:11px;fill:#546e7a;text-anchor:middle">Backbone: ~1.3M параметров | cls_head: ~131K | reg_head: ~131K | Всего: ~1.57M параметров</text>
</svg>
</body>
</html>
