<svg viewBox="0 0 1040 660" xmlns="http://www.w3.org/2000/svg" font-family="'Times New Roman', Georgia, serif">
<rect width="1040" height="660" fill="#FFFFFF"/>

<!-- algorithm box -->
<rect x="20" y="20" width="1000" height="620" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>

<!-- title bar -->
<rect x="20" y="20" width="1000" height="46" fill="#ECEFF1" stroke="#111111" stroke-width="2"/>
<text x="36" y="51" font-size="21" font-weight="700" fill="#111111">Algoritm 1.  2D &#8594; 3D fraktal rekonstruksiya</text>

<!-- input / output -->
<text x="36" y="92" font-size="16" fill="#111111"><tspan font-weight="700">Kirish (Input):</tspan>  2D fraktal tasvir  I</text>
<text x="36" y="116" font-size="16" fill="#111111"><tspan font-weight="700">Chiqish (Output):</tspan>  3D mesh M (OBJ/PLY) + chuqurlik xaritasi + verifikatsiya</text>
<line x1="20" y1="132" x2="1020" y2="132" stroke="#111111" stroke-width="1"/>

<!-- ============ STEPS ============ -->
<!-- group styling: code = monospace black, comments = gray italic, headers = blue bold italic -->

<!-- Layer 1 header -->
<text x="44" y="158" font-size="15" font-style="italic" font-weight="700" fill="#1565C0">// Layer 1 — Matematik tahlil</text>

<text x="66" y="184" font-size="15" fill="#607D8B" text-anchor="end" font-family="Consolas,'Courier New',monospace">1</text>
<text x="84" y="184" font-size="15" fill="#111111" font-family="Consolas,'Courier New',monospace">gray := to_gray(I)</text>

<text x="66" y="210" font-size="15" fill="#607D8B" text-anchor="end" font-family="Consolas,'Courier New',monospace">2</text>
<text x="84" y="210" font-size="15" fill="#111111" font-family="Consolas,'Courier New',monospace">(D, fourier, lacun, multifr) := {box_counting, Fourier, lacunarity, multifraktal}(gray)</text>

<!-- Layer 2 header -->
<text x="44" y="236" font-size="15" font-style="italic" font-weight="700" fill="#7B1FA2">// Layer 2 — CNN klassifikatsiya</text>

<text x="66" y="262" font-size="15" fill="#607D8B" text-anchor="end" font-family="Consolas,'Courier New',monospace">3</text>
<text x="84" y="262" font-size="15" fill="#111111" font-family="Consolas,'Courier New',monospace">(klass, conf, embedding) := FractalCNN.classify(I)</text>

<text x="66" y="288" font-size="15" fill="#607D8B" text-anchor="end" font-family="Consolas,'Courier New',monospace">4</text>
<text x="84" y="288" font-size="15" fill="#111111" font-family="Consolas,'Courier New',monospace">likely_escape := prescreen_escape();  ifs := recover_ifs(gray, likely_escape)</text>

<!-- Layer 3 header -->
<text x="44" y="314" font-size="15" font-style="italic" font-weight="700" fill="#EF6C00">// Layer 3 — Birlashtirish (weighted voting)</text>

<text x="66" y="340" font-size="15" fill="#607D8B" text-anchor="end" font-family="Consolas,'Courier New',monospace">5</text>
<text x="84" y="340" font-size="15" fill="#111111" font-family="Consolas,'Courier New',monospace">decision := vote(...)  =&gt;  final_type, kategoriya, is_escape_time, conf</text>

<text x="66" y="366" font-size="15" fill="#607D8B" text-anchor="end" font-family="Consolas,'Courier New',monospace">6</text>
<text x="84" y="366" font-size="15" font-family="Consolas,'Courier New',monospace"><tspan fill="#111111" font-weight="700">if</tspan><tspan fill="#111111" dx="7">not is_escape_time:  ifs := recover_ifs(gray, fast=False)</tspan><tspan fill="#78909C" font-style="italic" dx="10">// kanonik affin xaritalar</tspan></text>

<!-- Depth + 3D header -->
<text x="44" y="392" font-size="15" font-style="italic" font-weight="700" fill="#4527A0">// Chuqurlik xaritasi va 3D sintez</text>

<text x="66" y="418" font-size="15" fill="#607D8B" text-anchor="end" font-family="Consolas,'Courier New',monospace">7</text>
<text x="84" y="418" font-size="15" font-family="Consolas,'Courier New',monospace"><tspan fill="#111111">mode := resolve_neural_mode(decision, I)</tspan><tspan fill="#78909C" font-style="italic" dx="10">// matematik / neyron (photo-detektor)</tspan></text>

<text x="66" y="444" font-size="15" fill="#607D8B" text-anchor="end" font-family="Consolas,'Courier New',monospace">8</text>
<text x="84" y="444" font-size="15" fill="#111111" font-family="Consolas,'Courier New',monospace">depth := build_depth_map(final_type, is_escape_time, ifs, I, mode, CRF)</text>

<text x="66" y="470" font-size="15" fill="#607D8B" text-anchor="end" font-family="Consolas,'Courier New',monospace">9</text>
<text x="84" y="470" font-size="15" font-family="Consolas,'Courier New',monospace"><tspan fill="#111111">mesh := build_mesh(depth, res = 48/64)</tspan><tspan fill="#78909C" font-style="italic" dx="10">// height-field relief</tspan></text>

<text x="66" y="496" font-size="15" fill="#607D8B" text-anchor="end" font-family="Consolas,'Courier New',monospace">10</text>
<text x="84" y="496" font-size="15" font-family="Consolas,'Courier New',monospace"><tspan fill="#111111">files := export_mesh(mesh, metadata)</tspan><tspan fill="#78909C" font-style="italic" dx="10">// OBJ / PLY fayllar</tspan></text>

<!-- Layer 4 header -->
<text x="44" y="522" font-size="15" font-style="italic" font-weight="700" fill="#2E7D32">// Layer 4 — Verifikatsiya (analysis-by-synthesis)</text>

<text x="66" y="548" font-size="15" fill="#607D8B" text-anchor="end" font-family="Consolas,'Courier New',monospace">11</text>
<text x="84" y="548" font-size="15" fill="#111111" font-family="Consolas,'Courier New',monospace">render := render_topdown(synthesize(decision))</text>

<text x="66" y="574" font-size="15" fill="#607D8B" text-anchor="end" font-family="Consolas,'Courier New',monospace">12</text>
<text x="84" y="574" font-size="15" fill="#111111" font-family="Consolas,'Courier New',monospace">similarity := compare(I, render)</text>

<text x="66" y="600" font-size="15" fill="#607D8B" text-anchor="end" font-family="Consolas,'Courier New',monospace">13</text>
<text x="84" y="600" font-size="15" font-family="Consolas,'Courier New',monospace"><tspan fill="#111111" font-weight="700">return</tspan><tspan fill="#111111" dx="7">mesh, files, depth, similarity</tspan></text>

<line x1="20" y1="620" x2="1020" y2="620" stroke="#111111" stroke-width="1"/>

</svg>
